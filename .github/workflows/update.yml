name: Auto Update TWSE OHLCV DB

on:
  schedule:
    - cron: '17 9,13 * * 1-5'
  workflow_dispatch: 

jobs:
  update-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas requests urllib3 openpyxl

      - name: Run update script
        env:
          # ======== 這裡將 GitHub Secrets 載入給 Python 使用 ========
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python update_db.py

      - name: Commit and push DB changes to CURRENT repo (stock-scanner)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add twse_ohlcv.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update twse_ohlcv.db" && git push)

      - name: Push DB to stock-monitor-FUBON and precompute trendlines
        env:
          TARGET_REPO_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
          # ==== 目標專案已經更改為新帳號 hueiling0310 ====
          TARGET_REPO: "hueiling0310/stock-monitor-FUBON" 
          TARGET_BRANCH: "main" # 若預設分支為 master，請改成 master
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p target_repo
          git clone https://x-access-token:${TARGET_REPO_TOKEN}@github.com/${TARGET_REPO}.git target_repo
          
          # 將剛剛在 scanner 更新好的 DB 複製到目標專案資料夾
          cp twse_ohlcv.db target_repo/
          cd target_repo
          
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # 執行下降趨勢線預先計算
          if [ -f "precompute_trendlines.py" ]; then
            pip install --quiet pandas requests
            python precompute_trendlines.py || echo "::warning::precompute_trendlines.py 執行失敗"
          else
            echo "::warning::目標專案找不到 precompute_trendlines.py，略過下降趨勢線預先計算"
          fi

          # 準備推送 DB 與計算結果
          git add twse_ohlcv.db
          if [ -f trendline_levels.json ]; then
            git add trendline_levels.json
          fi
          
          # 若有變更則 Commit 並 Push 回 stock-monitor-FUBON
          git diff --quiet && git diff --staged --quiet || (git commit -m "Sync latest DB and trendline levels from scanner" && git push origin ${TARGET_BRANCH})
